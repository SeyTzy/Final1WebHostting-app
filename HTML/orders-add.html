<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvenTrack | Add Order</title>
    <link rel="stylesheet" href="../CSS/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand"><a href="dashboard.html"><i class="fas fa-cube"></i><span>InvenTrack</span></a></div>
            <div class="sidebar-profile">
                <div class="profile-card"><img src="/Image/My Pf.jpg" alt="Profile" class="profile-avatar"><div><div class="profile-name">THOEURN SEYHAT</div><div class="profile-role">Web Developer</div><div class="profile-contact"><a href="contact.html"><i class="fas fa-envelope"></i> thoeurnseyhat@gmail.com</a></div></div></div>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link"><i class="fas fa-home"></i><span>Dashboard</span></a>
                <div class="nav-group"><button class="nav-toggle"><i class="fas fa-box-archive"></i><span>Products</span><i class="fas fa-chevron-right nav-arrow"></i></button><div class="sub-nav"><a href="products-add.html" class="sub-link">Add Product</a><a href="products-list.html" class="sub-link">Product List</a></div></div>
                <div class="nav-group"><button class="nav-toggle"><i class="fas fa-layer-group"></i><span>Categories</span><i class="fas fa-chevron-right nav-arrow"></i></button><div class="sub-nav"><a href="categories-add.html" class="sub-link">Add Category</a><a href="categories-list.html" class="sub-link">Category List</a></div></div>
                <div class="nav-group"><button class="nav-toggle open"><i class="fas fa-cart-shopping"></i><span>Orders</span><i class="fas fa-chevron-right nav-arrow"></i></button><div class="sub-nav"><a href="orders-add.html" class="sub-link active">Add Order</a><a href="orders-list.html" class="sub-link">Order List</a></div></div>
                <div class="nav-group"><button class="nav-toggle"><i class="fas fa-user-group"></i><span>Users</span><i class="fas fa-chevron-right nav-arrow"></i></button><div class="sub-nav"><a href="users-add.html" class="sub-link">Add User</a><a href="users-list.html" class="sub-link">User List</a></div></div>
                <a href="settings.html" class="nav-link"><i class="fas fa-sliders"></i><span>Settings</span></a>
            </nav>
            <div class="sidebar-footer"><div class="user-row"><div class="user-avatar-sm">AD</div><div><div class="user-name-sm">Admin User</div><div class="user-role-sm">Administrator</div></div></div></div>
        </aside>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <div class="main">
            <header class="topbar">
                <div class="topbar-left"><button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button><span class="topbar-title">Orders</span></div>
                <div class="topbar-right"><a href="orders-list.html" class="btn btn-secondary btn-sm"><i class="fas fa-list"></i> View List</a></div>
            </header>
            <main class="content">
                <div class="page-header"><h1 class="page-title">Add New Order</h1><p class="page-desc">Create a new sales order.</p></div>
                <div class="card">
                    <div class="card-body">
                        <div class="form-group" style="margin-bottom:16px"><label class="form-label">Customer</label><input type="text" class="form-input" id="oCustomer" placeholder="Enter customer name..."></div>
                        <div class="form-row" style="margin-bottom:16px">
                            <div class="form-group"><label class="form-label">Product</label><input type="text" class="form-input" id="oProduct" placeholder="Product name..."></div>
                            <div class="form-group"><label class="form-label">Quantity</label><input type="number" class="form-input" id="oQty" placeholder="1"></div>
                            <div class="form-group"><label class="form-label">Total</label><input type="number" class="form-input" id="oTotal" placeholder="0.00"></div>
                        </div>
                        <div class="form-actions"><button class="btn btn-primary" id="submitOrder"><i class="fas fa-save"></i> Save Order</button></div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="../JS/common.js"></script>
    <script src="../JS/settings.js"></script>
    <script src="../JS/orders.js"></script>
</body>
</html>
