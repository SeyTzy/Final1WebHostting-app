<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/CSS/style.css" />
    <title>InvenTrack | Login</title>
    <link rel="icon" href="/Image/logo_and_icon/film-tape-unscreen.gif" />
    <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.3/dist/dotlottie-wc.js" type="module"></script>
  </head>
  <body>
    <div class="header">
      <div class="navbar">
        <img src="/Image/logo.png" class="logo" />
        <button class="btn" id="open"><span></span>Log In</button>
      </div>
    </div>

    <div class="popup-form" id="login-form">
      <dotlottie-wc
        src="https://lottie.host/ff3e8212-0390-44df-b51b-7e3fc2021a25/dDSCEgxQ6z.lottie"
        style="width: 200px;height: 200px"
        autoplay
        loop>
      </dotlottie-wc>
      <div class="right">
        <h2>Login</h2>
        <p></p>
        <div class="form">
          <div class="input">
            <label for="email">Email</label>
            <div class="inputbox">
              <input type="text" required id="login-email" placeholder="example@gmail.com.."/>
            </div>
            <label for="password">Password</label>
            <div class="inputbox">
              <input type="password" required id="login-password" placeholder="Enter your password.."/>
            </div>

            <div class="button">
              <button>Log In</button>
            </div>
          </div>
        </div>
        <p>&nbsp;</p>
      </div>
      <p class>
        Don't have an account? &nbsp;<a href="#" class="signup">Sign up</a>
      </p>

      <button class="close-bn">&times;</button>
    </div>

    <div class="popup-form" id="signup-form">
      <!-- <div class="left">
        <img style="border-radius: 50%" src="/Image/1.jpg" alt="" width="100%" />
      </div> -->
      <dotlottie-wc
        src="https://lottie.host/d59ca950-8fdb-42d0-a147-9696da709c93/qlJrKPyHb8.lottie"
        style="width: 300px;height: 300px"
        autoplay
        loop>
      </dotlottie-wc>
      <div class="right">
        <h2>Sign Up</h2>
        <p></p>
        <div class="form">
          <div class="input">
            <label for="email">Email</label>
            <div class="inputbox">
              <input type="text" required id="signup-email" placeholder="example@gmail.com.."/>
            </div>
            <label for="password">Password</label>
            <div class="inputbox">
              <input type="password" required id="signup-password" placeholder="Enter password.."/>
            </div>
            <label for="confirm-password">Confirm Password</label>
            <div class="inputbox">
              <input type="password" required id="confirm-password" placeholder="Confirm your password.."/>
            </div>
            <div class="button">
              <button type="button">Sign Up</button>
            </div>
          </div>
        </div>
        <p>&nbsp;</p>
      </div>
      <p class>
        Already have account! &nbsp;<a href="#" class="signup" id="goto-login">Log in</a>
      </p>
      <button class="close-bn" id="close-signup">&larr;</button>
    </div>
    <script src="./JS/OpenLogin.js"></script>
    <script src="./JS/Login.js"></script>
  </body>
</html>
